name: Deploy to GitHub Pages

permissions:
  contents: write # Дозволяє записувати зміни в репозиторій
  pages: write # Дозволяє розгортання на GitHub Pages

on:
  push:
    branches:
      - main # Переконайся, що назва гілки правильна

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
    steps:
      # Отримання коду репозиторію
      - name: Checkout code
        uses: actions/checkout@v2

      # Налаштування Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # За потреби зміни версію Node.js

      # Встановлення залежностей
      - name: Install dependencies
        run: |
          npm install

      # Збирання застосунку
      - name: Build the app
        run: |
          npm run build

      # Розгортання на GitHub Pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # Гілка, у яку буде розгорнуто застосунок
          folder: dist # Папка зі зібраним React-застосунком
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Токен для автентифікації
